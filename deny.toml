# Dependency audit configuration for `cargo deny check` / `cargo xtask audit`.
# Runs automatically in lefthook's pre-push hook; run manually with `cargo xtask audit`.

[advisories]
# RustSec advisory database. `cargo deny` downloads and caches it on first run.
db-path = "~/.cargo/advisory-db"
yanked = "warn"
# Error only if an unmaintained crate is a direct dependency.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
# Source installs (`cargo install colark`) must not need system OpenSSL: the
# HTTP and WebSocket stacks use rustls. If a new dependency drags OpenSSL back
# into the graph, fail the audit instead of shipping a build that needs libssl.
deny = [
  { name = "openssl-sys", reason = "rustls is the TLS stack; system OpenSSL must stay optional" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "ISC",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"