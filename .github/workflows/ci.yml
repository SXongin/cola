name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A pull request cancels its own superseded run: pushing a fix should not
  # queue a run of the version it replaces. A push to `main` does not share a
  # group with any other run — macOS runs only there (ADR-0097), so cancelling
  # an older main run would drop the only macOS check for that commit, exactly
  # when a second merge lands while the first is still running.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if [ -n "$changed" ] && ! grep -qvE '^(docs/|\.scratch/)|\.md$|^LICENSE$|^deny\.toml$' <<<"$changed"; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check

  check:
    # Clippy + release build on the primary platform; they share one cargo
    # cache so dependencies compile once instead of once per gate. The tests
    # run instrumented in the coverage job, so they are not repeated here.
    name: Check
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          # `check-fixture-format` below runs rustfmt; the toolchain profile is
          # minimal, so a component not named here is not installed.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Generation guard (V1 coupling)
        run: cargo xtask check-generation
      - name: Client seam guard (no adapter path outside src/opencode)
        run: cargo xtask check-client-seam
      - name: Codex proxy fixture format
        run: cargo xtask check-fixture-format
      - name: Build (release)
        run: cargo build --release --locked

  coverage:
    # Primary-platform test gate and coverage source: runs the workspace tests
    # under LLVM instrumentation, then uploads lcov to Codecov, which posts the
    # per-PR coverage comment and the project/patch status checks.
    #
    # One-time setup: sign in at https://codecov.io with GitHub, add this
    # repository, install the Codecov GitHub App, and set the upload token as
    # the CODECOV_TOKEN repository secret. Until then the upload fails softly
    # (fail_ci_if_error: false) and CI stays green.
    name: Coverage
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    # Same bound as the `test` job for the same reason: it runs the same
    # workspace suite, so the same wedge hangs it silently (see `test`).
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - name: Test (instrumented, lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  live-v1:
    # The live V1 contract suite (ADR-0057): the real pinned 1.18.31 binary
    # runs its agent loop against an in-process scripted provider, in an
    # isolated store. Required by the `main: CI` ruleset (#376). The suite is
    # `#[ignore]`-gated, so no hermetic job ever runs it.
    #
    # The docs-only and release/* skips gate the STEPS, not the job: a
    # job-level skip would leave the required `Live V1` check unreported and
    # block the PR. A dispatched job with skipped steps reports success under
    # the required name instead (the same shape as the Test matrix).
    name: Live V1
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: ./.github/actions/install-opencode-v1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Live V1 suite
        run: cargo test --locked -- --ignored live_v1

  live-v2:
    # The live V2 contract suite (ADR-0057): the real pinned 2.0.27 binary runs
    # its agent loop against an in-process scripted provider, in an isolated
    # store. Required by the `main: CI` ruleset (#376), same step-gating shape
    # as Live V1: only the steps are skipped for docs-only and release/* PRs,
    # so the required `Live V2` check still reports.
    name: Live V2
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: ./.github/actions/install-opencode-v2
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Live V2 suite
        run: cargo test --locked -- --ignored live_v2

  live-codex-tier1:
    # tier-1 of the Codex live contract (ticket #953): the real pinned 0.166.0
    # binary starts `app-server --listen unix://<short path>` in an isolated
    # `CODEX_HOME`, a scripted Responses provider answers the model protocol,
    # and cola attaches through `codex app-server proxy`. Advisory at first
    # (not part of the required ruleset). The docs-only and release/* skips
    # gate the STEPS, not the job, so the check always reports under its
    # matrix-expanded name.
    name: Live Codex tier-1 (${{ matrix.os }})
    needs: classify
    if: always()
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: ./.github/actions/install-codex
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Live Codex tier-1 suite
        env:
          COLA_LIVE_CODEX_PID_FILE: ${{ runner.temp }}/codex-live-tier1-pids.txt
        run: cargo test --locked -- --ignored live_codex_tier1
      # The suite asserts its own cleanup; this re-checks the pids and runtime
      # paths it recorded after the test process exits. The argv scan is only a
      # fallback: temp paths are random and a Windows daemon's argv does not
      # carry them. The shared script also waits out the brief settle window
      # before failing a pid or a path.
      - if: >-
          always() &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: No live Codex process or runtime path left behind
        shell: bash
        env:
          COLA_LIVE_CODEX_PID_FILE: ${{ runner.temp }}/codex-live-tier1-pids.txt
        run: bash .github/scripts/check-live-codex-cleanup.sh tier-1

  live-codex-tier2:
    # tier-2 of the Codex live contract (ticket #953): the real managed daemon
    # started by Codex itself — discovery through the control socket's symlink,
    # the `daemon version` report, `start_server = "never"` refusing a start,
    # `auto` starting one, and the restart refusal. Ubuntu and macOS only: the
    # daemon refuses an elevated token, and hosted Windows runners are elevated.
    # Advisory at first; the job name always reports, like Live V1/V2.
    name: Live Codex tier-2 (${{ matrix.os }})
    needs: classify
    if: always()
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: ./.github/actions/install-codex
      # The GitHub-release asset is a standalone CLI: `daemon bootstrap` fails
      # with "this CLI has no complete local package". The npm package ships
      # the managed package `daemon bootstrap` installs, so tier-2 runs the
      # npm shim while tier-1 keeps the release asset on PATH. The main npm
      # tarball is SHA-256-pinned (ADR-0057's exact version + artifact digest);
      # npm still resolves the platform package from the registry with its own
      # integrity. `--prefix` installs no global bin entry, so it cannot shadow
      # tier-1's `codex`.
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Install the npm Codex package for tier-2
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/codex-npm"
          tarball="$RUNNER_TEMP/codex-0.166.0.tgz"
          digest=67ee6f4069d9328956401f54ac202c20369233159058af9f4ec1af731b87f5b7
          curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/@openai/codex/-/codex-0.166.0.tgz" \
            --output "$tarball"
          actual=$(shasum -a 256 "$tarball" | awk '{print $1}')
          if [ "$actual" != "$digest" ]; then
            echo "the npm Codex tarball SHA-256 is $actual, expected $digest" >&2
            exit 1
          fi
          npm install --prefix "$prefix" --ignore-scripts "$tarball"
          shim="$prefix/node_modules/.bin/codex"
          if [ ! -x "$shim" ]; then
            echo "the npm Codex shim is missing or not executable: $shim" >&2
            ls -la "$prefix/node_modules/.bin" >&2 || true
            exit 1
          fi
          "$shim" --version
          echo "COLA_LIVE_CODEX_BIN=$shim" >> "$GITHUB_ENV"
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Live Codex tier-2 suite
        env:
          COLA_LIVE_CODEX_PID_FILE: ${{ runner.temp }}/codex-live-tier2-pids.txt
        run: cargo test --locked -- --ignored live_codex_tier2
      - if: >-
          always() &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: No live Codex daemon or runtime path left behind
        shell: bash
        env:
          COLA_LIVE_CODEX_PID_FILE: ${{ runner.temp }}/codex-live-tier2-pids.txt
        run: bash .github/scripts/check-live-codex-cleanup.sh tier-2

  test:
    # The platform matrix follows the event. A pull request runs Windows; a
    # push to `main` runs macOS. Both are the "other platforms" whose quirks
    # Linux cannot show — Linux itself is the `Coverage` job — and the split
    # exists because macOS capacity is not: hosted macOS arm64 jobs queue
    # behind scarcity and GitHub gives up on them with "The job was not
    # acquired by Runner of type hosted" after ~15 minutes, which on a
    # required check means no PR can merge (2026-11-04: three macOS jobs
    # cancelled that way, `Test (macos-latest)` twice). macOS therefore
    # reports on the merge instead of gating it, and `main: CI` requires only
    # `Test (windows-latest)`.
    #
    # Full release builds still run on all three platforms in release.yml,
    # which is the check that would catch a macOS-only compile break.
    #
    # The docs-only and release/* skips gate the STEPS, not the job: a
    # job-level skip leaves the matrix unexpanded (`Test (${{ matrix.os }})`),
    # so the required `Test (windows-latest)` check never reports and the PR
    # is blocked. A dispatched job with skipped steps reports success under
    # the expanded name instead.
    name: Test (${{ matrix.os }})
    needs: classify
    if: always()
    # Bounded on purpose: `cargo test` has no per-test timeout, so one wedged
    # test (a deadlock, a runner that stops making progress) hangs the job
    # silently — GitHub serves no logs while a job is in progress — until the
    # 360-minute default. A Windows run on #935 sat in `cargo test` for 40
    # minutes with no output while the same commit's macOS finished in 6. 30
    # minutes is ~4x the slowest observed run (7m47s) and turns that failure
    # from a silent hang into a red check with the partial log.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        run: cargo test --workspace --locked

  docs-drift:
    # The zh-CN user guide must stay structurally in step with its English
    # source (docs/user-guide.md). Deliberately NOT gated by `classify`: a
    # docs-only PR is classified `heavy=false` and skips every code job — and
    # is exactly the PR that edits the guide pair, so this guard must still
    # run there. Required by the `main: CI` ruleset; it needs only a checkout
    # and the toolchain.
    name: Docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Docs drift (zh-CN vs English)
        run: cargo xtask check-doc-drift

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
