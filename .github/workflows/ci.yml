name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is what makes the draft split work: a draft run skips
    # the heavy jobs (they gate on `classify`'s `draft`), and this event is the
    # one that spends the whole suite, once, when the code is final.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # A pull request cancels its own superseded run: pushing a fix should not
  # queue a run of the version it replaces. A push to `main` does not share a
  # group with any other run, so two merges in flight both get their run
  # (ADR-0099) instead of the later one cancelling the earlier.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      # `pull_request.draft` is absent on a push, where every job runs anyway.
      draft: ${{ github.event.pull_request.draft || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if [ -n "$changed" ] && ! grep -qvE '^(docs/|\.scratch/)|\.md$|^LICENSE$|^deny\.toml$' <<<"$changed"; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check

  check:
    # Clippy + release build on the primary platform; they share one cargo
    # cache so dependencies compile once instead of once per gate. The tests
    # run instrumented in the coverage job, so they are not repeated here.
    name: Check
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.draft != 'true' &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          # `check-fixture-format` below runs rustfmt; the toolchain profile is
          # minimal, so a component not named here is not installed.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Generation guard (V1 coupling)
        run: cargo xtask check-generation
      - name: Client seam guard (no adapter path outside src/opencode)
        run: cargo xtask check-client-seam
      - name: Codex proxy fixture format
        run: cargo xtask check-fixture-format
      - name: Build (release)
        run: cargo build --release --locked

  coverage:
    # Primary-platform test gate and coverage source: runs the workspace tests
    # under LLVM instrumentation, then uploads lcov to Codecov, which posts the
    # per-PR coverage comment and the project/patch status checks.
    #
    # One-time setup: sign in at https://codecov.io with GitHub, add this
    # repository, install the Codecov GitHub App, and set the upload token as
    # the CODECOV_TOKEN repository secret. Until then the upload fails softly
    # (fail_ci_if_error: false) and CI stays green.
    name: Coverage
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.draft != 'true' &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    # Same bound as the `test` job for the same reason: it runs the same
    # workspace suite, so the same wedge hangs it silently (see `test`).
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov
      - name: Test (instrumented, lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  live-opencode:
    # Both live contract suites (ADR-0057) in one job: the V1 chains and the V2
    # chains need different pinned binaries but the *same* compiled test binary,
    # so two jobs built the 314k-line crate twice to run a handful of
    # `#[ignore]` tests (measured 2026-11-04: 2.3 min and 2.0 min, almost none
    # of it suite time). One job installs both binaries — they expose different
    # names, `opencode` and `opencode2`, so neither shadows the other — and runs
    # each suite in turn.
    #
    # Required by the `main: CI` ruleset as `Live OpenCode` (#376). The
    # docs-only and release/* skips gate the STEPS, not the job: a job-level
    # skip would leave the required check unreported and block the PR. A
    # dispatched job with skipped steps reports success under its name instead
    # (the same shape as the Test matrix).
    name: Live OpenCode
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.draft != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: ./.github/actions/install-opencode-v1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Live V1 suite
        run: cargo test --locked -- --ignored live_v1
      # `always()` on the V2 steps: a broken V1 chain must not hide the V2
      # result for the same commit. The heavy/release gate still applies, so a
      # docs-only PR skips both.
      - if: >-
          always() &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: ./.github/actions/install-opencode-v2
      - if: >-
          always() &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Live V2 suite
        run: cargo test --locked -- --ignored live_v2

  live-codex:
    # tier-1 and tier-2 of the Codex live contract (ticket #953) share one job
    # per OS. Every live job pays a checkout, a `rust-cache` restore and a full
    # compile of the crate before running a handful of `#[ignore]` tests, so
    # running both tiers in one job builds the crate once instead of twice
    # (measured 2026-11-04 on a green PR: the ubuntu job is 2.5 min and the
    # windows one 6.2 min, almost none of which is the suite itself). It also
    # leaves macOS one queued job instead of two, which is where the wall time
    # actually goes.
    #
    # Windows runs tier-1 only: tier-2's managed daemon refuses an elevated
    # token and hosted Windows runners are elevated, so tier-2's steps skip
    # there. A step-level skip, never a job-level one, so the check still
    # reports under its matrix-expanded name.
    #
    # Advisory (not part of the required ruleset); the docs-only and release/*
    # skips gate the STEPS, like every other job here.
    name: Live Codex (${{ matrix.os }})
    needs: classify
    if: always()
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: ./.github/actions/install-codex
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Live Codex tier-1 suite
        env:
          COLA_LIVE_CODEX_PID_FILE: ${{ runner.temp }}/codex-live-tier1-pids.txt
        run: cargo test --locked -- --ignored live_codex_tier1
      # The suite asserts its own cleanup; this re-checks the pids and runtime
      # paths it recorded after the test process exits. The argv scan is only a
      # fallback: temp paths are random and a Windows daemon's argv does not
      # carry them. The shared script also waits out the brief settle window
      # before failing a pid or a path.
      - if: >-
          always() &&
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: No live Codex process or runtime path left behind
        shell: bash
        env:
          COLA_LIVE_CODEX_PID_FILE: ${{ runner.temp }}/codex-live-tier1-pids.txt
        run: bash .github/scripts/check-live-codex-cleanup.sh tier-1
      # The GitHub-release asset is a standalone CLI: `daemon bootstrap` fails
      # with "this CLI has no complete local package". The npm package ships
      # the managed package `daemon bootstrap` installs, so tier-2 runs the
      # npm shim while tier-1 keeps the release asset on PATH. The main npm
      # tarball is SHA-256-pinned (ADR-0057's exact version + artifact digest);
      # npm still resolves the platform package from the registry with its own
      # integrity. `--prefix` installs no global bin entry, and the shim is
      # handed to tier-2's step as an output rather than through `$GITHUB_ENV`,
      # so it cannot shadow the release asset `codex` that tier-1 just used.
      - if: >-
          matrix.os != 'windows-latest' &&
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Install the npm Codex package for tier-2
        id: codex-npm
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/codex-npm"
          tarball="$RUNNER_TEMP/codex-0.166.0.tgz"
          digest=67ee6f4069d9328956401f54ac202c20369233159058af9f4ec1af731b87f5b7
          curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/@openai/codex/-/codex-0.166.0.tgz" \
            --output "$tarball"
          actual=$(shasum -a 256 "$tarball" | awk '{print $1}')
          if [ "$actual" != "$digest" ]; then
            echo "the npm Codex tarball SHA-256 is $actual, expected $digest" >&2
            exit 1
          fi
          npm install --prefix "$prefix" --ignore-scripts "$tarball"
          shim="$prefix/node_modules/.bin/codex"
          if [ ! -x "$shim" ]; then
            echo "the npm Codex shim is missing or not executable: $shim" >&2
            ls -la "$prefix/node_modules/.bin" >&2 || true
            exit 1
          fi
          "$shim" --version
          echo "bin=$shim" >> "$GITHUB_OUTPUT"
      - if: >-
          matrix.os != 'windows-latest' &&
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: Live Codex tier-2 suite
        env:
          COLA_LIVE_CODEX_PID_FILE: ${{ runner.temp }}/codex-live-tier2-pids.txt
          COLA_LIVE_CODEX_BIN: ${{ steps.codex-npm.outputs.bin }}
        run: cargo test --locked -- --ignored live_codex_tier2
      - if: >-
          always() &&
          matrix.os != 'windows-latest' &&
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        name: No live Codex daemon or runtime path left behind
        shell: bash
        env:
          COLA_LIVE_CODEX_PID_FILE: ${{ runner.temp }}/codex-live-tier2-pids.txt
        run: bash .github/scripts/check-live-codex-cleanup.sh tier-2

  test:
    # Compile + test on both non-Linux platforms: each catches quirks the
    # `Coverage` job (Linux) cannot show, and full release builds run on all
    # three in release.yml.
    #
    # Both legs are required even though a starved runner pool can hold a PR
    # for ~15 minutes and then cancel the job. A capacity event is met by a
    # re-run, never by demoting a platform out of the gate: the same rule has
    # to hold for Windows and Linux, or the gate erodes one outage at a time
    # (ADR-0099, which supersedes ADR-0097's 2026-11-04 response to a
    # three-hour macOS shortage — 0 of 90 macOS jobs starved before it, 31 of
    # 37 during it, 0 of 5 after).
    #
    # The docs-only and release/* skips gate the STEPS, not the job: a
    # job-level skip leaves the matrix unexpanded (`Test (${{ matrix.os }})`),
    # so the required `Test (…)` checks never report and the PR is blocked. A
    # dispatched job with skipped steps reports success under the expanded
    # names instead.
    name: Test (${{ matrix.os }})
    needs: classify
    if: always()
    # Bounded on purpose: `cargo test` has no per-test timeout, so one wedged
    # test (a deadlock, a runner that stops making progress) hangs the job
    # silently — GitHub serves no logs while a job is in progress — until the
    # 360-minute default. A Windows run on #935 sat in `cargo test` for 40
    # minutes with no output while the same commit's macOS finished in 6. 30
    # minutes is ~4x the slowest observed run (7m47s) and turns that failure
    # from a silent hang into a red check with the partial log.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: >-
          needs.classify.outputs.draft != 'true' &&
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        run: cargo test --workspace --locked

  docs-drift:
    # The zh-CN user guide must stay structurally in step with its English
    # source (docs/user-guide.md). Deliberately NOT gated by `classify`: a
    # docs-only PR is classified `heavy=false` and skips every code job — and
    # is exactly the PR that edits the guide pair, so this guard must still
    # run there. Required by the `main: CI` ruleset; it needs only a checkout
    # and the toolchain.
    name: Docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Docs drift (zh-CN vs English)
        run: cargo xtask check-doc-drift

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
