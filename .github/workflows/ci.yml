name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if [ -n "$changed" ] && ! grep -qvE '^(docs/|\.scratch/)|\.md$|^LICENSE$|^deny\.toml$' <<<"$changed"; then
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check

  check:
    # Clippy + release build on the primary platform; they share one cargo
    # cache so dependencies compile once instead of once per gate. The tests
    # run instrumented in the coverage job, so they are not repeated here.
    name: Check
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --release --locked

  coverage:
    # Primary-platform test gate and coverage source: runs the workspace tests
    # under LLVM instrumentation, then uploads lcov to Codecov, which posts the
    # per-PR coverage comment and the project/patch status checks.
    #
    # One-time setup: sign in at https://codecov.io with GitHub, add this
    # repository, install the Codecov GitHub App, and set the upload token as
    # the CODECOV_TOKEN repository secret. Until then the upload fails softly
    # (fail_ci_if_error: false) and CI stays green.
    name: Coverage
    needs: classify
    if: >-
      always() &&
      needs.classify.outputs.heavy != 'false' &&
      !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-llvm-cov
      - name: Test (instrumented, lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test:
    # Compile + test only on the other platforms: catches platform quirks
    # cheaply. Full release builds still run on all three in release.yml.
    # The docs-only and release/* skips gate the STEPS, not the job: a
    # job-level skip leaves the matrix unexpanded (`Test (${{ matrix.os }})`),
    # so the two required `Test (…)` checks the ruleset waits for never report
    # and the PR is blocked. A dispatched job with skipped steps reports
    # success under the expanded names instead.
    name: Test (${{ matrix.os }})
    needs: classify
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: >-
          needs.classify.outputs.heavy != 'false' &&
          !startsWith(github.head_ref || '', 'release/')
        run: cargo test --workspace --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
