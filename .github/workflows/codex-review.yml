# Codex reviews every non-draft in-repo PR on the two axes from CONTRIBUTING.md
# "Reviewing" plus an adversarial pass, and approves it when the review finds
# nothing blocking. That approval is the automated non-author review the
# `main: review` ruleset needs (ADR-0034 item 6); it replaces the OpenCode
# review workflow (trial: issue #516 / PR #517).
#
# Codex reaches the model through the OpenCode Go subscription: Console's
# inference API serves an OpenAI Responses-compatible endpoint and documents
# Codex as a validated client; `gpt-6-luna` is the top GPT model in Go. The
# action's Responses proxy points at that endpoint (`responses-api-endpoint`),
# keeps the Go key inside the proxy process, and runs Codex read-only
# (`permission-profile: ":read-only"` with the action's default safety
# strategy). GH_TOKEN stays on the gh steps only — never in the Codex step's
# environment, where prompt-injected PR content could read it.
#
# Approval contract: this workflow posts the review itself and records the new
# comment's ID as a step output; the approve step fetches exactly that comment
# and approves only when its final line is `CODEX_REVIEW_VERDICT: PASS`. The
# OpenCode gate read the *last* bot comment, which forced a first-line marker
# filter so the advisory trial's comments could not shadow the verdict
# (ADR-0034, 2026-10-04 amendment); comment-ID anchoring removes the scan, so
# the marker rule died with the trial workflow.
#
# Linked issues (#555): the prompt carries every issue the PR references — the
# body's closing/ref keywords and the commits' `Refs:` trailers, deduplicated,
# body references first, capped (`CODEX_MAX_LINKED_ISSUES`). The collector is
# written by the workflow itself and tested by `cargo test -p xtask codex_gate`
# like the verdict parser. A PR that references nothing, or whose reference
# cannot be fetched, fails the prompt step before Codex runs: the sandboxed
# reviewer can fetch nothing itself, and a review that never saw a spec must
# not look complete. `edited` sits in the trigger types so a body correction
# that adds a missing reference re-runs the gate by itself.
#
# Robustness (#530): the Codex action can hang AFTER Codex has written its
# complete output — a surviving descendant keeps the runner's stdio open, so
# the action never returns and the job dies on its timeout with the result
# already on disk (upstream openai/codex-action#150/#169; the wrapper fix,
# #151, is unreleased). The action is pinned to v1.11, whose wrapper handles
# the same heavy workload cleanly, and the Codex step is bounded with its
# output salvaged through the parser this workflow writes to `$RUNNER_TEMP`
# (never sourced from the reviewed tree, which may predate it; tested by
# xtask), so a recurrence cannot discard a finished review.
# Publication and approval are two tiers: a review whose last line ends with
# the verdict is published, while approval requires the marker to stand on its
# own line, so a quoted marker can never approve a change. A same-job retry is
# impossible: the action's drop-sudo safety strategy removes
# passwordless sudo, so a second invocation in the job cannot start. Revisit
# the pin when the wrapper fix ships.
#
# Trust model: like the OpenCode gate before it, this is a `pull_request`
# workflow, so a same-repo PR runs the workflow definition from its merge ref.
# Same-repo PR authors already have write access (they can edit any workflow);
# fork PRs get no secrets and are excluded below. If a stricter model is ever
# needed, moving the trigger to `pull_request_target` is the hardening to
# evaluate.
#
# Requires the repository setting Actions -> General -> "Allow GitHub Actions
# to create and approve pull requests". `require_last_push_approval` on the
# `main: review` ruleset means every synchronize must approve the newest
# commit; the last step skips the approval when the PR head moved mid-run.
name: Codex Review

on:
  pull_request:
    # `edited` so a body correction that adds a missing issue reference
    # re-runs the gate by itself (#555); body edits fire no `synchronize`.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Fork PRs never see secrets, so the model would have no API key to run
    # with. Dependabot PRs are skipped for the same reason: their runs get no
    # repository secrets, so `OPENCODE_API_KEY` would be empty. Drafts wait for
    # ready_for_review. Release PRs are skipped: their diff is a version bump
    # of code already reviewed on main, and the cut merges with the admin
    # bypass.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref || '', 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Review the PR's head commit, not the synthetic merge ref, so the
          # comment and the approval both name a real commit.
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          persist-credentials: false

      # The gate's scripts (#530, #555) are written from THIS workflow, not
      # sourced from the reviewed tree: the post, approve and prompt steps run
      # against `refs/pull/N/head`, a checkout that may predate them (a PR
      # branched before it failed with "verdict.sh: No such file or directory"
      # — #527 did, discarding a completed PASS review). The workflow
      # definition always comes from the merge ref, so the scripts travel with
      # it; xtask extracts these heredocs and tests them (`cargo test -p xtask
      # codex_gate`), keeping one definition.
      - name: Write the workflow scripts
        run: |
          cat > "$RUNNER_TEMP/codex-verdict.sh" <<'VERDICT_SH'
          # Shared verdict parsing for the Codex review gate (#530).
          #
          # One definition of "a complete review" and of the verdict it carries,
          # used by both the post step (may this review be published?) and the
          # approve step (which verdict does the published comment end with?).
          #
          # A review is COMPLETE when its last non-blank line ends with the
          # verdict marker. Blank means empty or whitespace-only — grep's
          # `[[:space:]]` includes `\r`, so a CRLF tail cannot smuggle a line
          # after the verdict. Markdown emphasis (`**…**`, a code span) around
          # the value is tolerated because the model emits it that way in
          # practice; prose may precede the marker on the same line, but
          # anything after the value except emphasis or whitespace (a period,
          # more prose) makes the review incomplete.
          #
          # Publication and approval deliberately differ: a complete review is
          # POSTED even when the marker shares its line with prose (nothing a
          # review says is discarded), but the APPROVE step requires the marker
          # to stand on its own line (emphasis tolerated), because a review
          # that merely quotes `…CODEX_REVIEW_VERDICT: PASS` while blocking the
          # change must never approve it. Approval is fail-closed.

          # The last non-blank line of stdin (empty when there is none).
          codex_last_line_stdin() {
            grep -v '^[[:space:]]*$' 2>/dev/null | tail -n 1 || true
          }

          # The last non-blank line of file $1 (empty when there is none).
          codex_last_line() {
            codex_last_line_stdin < "$1"
          }

          # The PASS/FAIL verdict that line $1 ends with (empty when it carries
          # none). Used for publication/completeness, never for approval.
          codex_verdict_of_line() {
            printf '%s\n' "$1" | sed -nE 's/.*CODEX_REVIEW_VERDICT: (PASS|FAIL)[*`[:space:]]*$/\1/p'
          }

          # The PASS/FAIL verdict of a line that IS exactly the marker, modulo
          # markdown emphasis and whitespace (empty otherwise) — the only form
          # the approve step accepts.
          codex_strict_verdict_of_line() {
            printf '%s\n' "$1" | sed -nE 's/^[*`[:space:]]*CODEX_REVIEW_VERDICT: (PASS|FAIL)[*`[:space:]]*$/\1/p'
          }

          # The verdict file $1 carries on its last non-blank line (empty when
          # the output is incomplete).
          codex_verdict_of_file() {
            codex_verdict_of_line "$(codex_last_line "$1")"
          }

          # File $1 through its last non-blank line — trailing blank lines
          # dropped (a CR-only tail included), so the verdict stays the final
          # line of anything built from this output.
          codex_trim_trailing_blanks() {
            awk '{lines[NR]=$0} $0 !~ /^[[:space:]]*$/ {last=NR} END{for (i=1; i<=last; i++) print lines[i]}' "$1"
          }
          VERDICT_SH
          echo "parser written to $RUNNER_TEMP/codex-verdict.sh"
          cat > "$RUNNER_TEMP/codex-linked-issues.sh" <<'LINKED_ISSUES_SH'
          # Linked-issue collection for the Codex review gate (#555).
          #
          # One definition of which issue references a PR carries (its body's
          # closing/ref keywords and its commits' `Refs:` trailers), of their
          # order (body first, first-seen), and of how many the review prompt
          # embeds. Both definitions are exercised by
          # `cargo test -p xtask codex_gate`.

          # The prompt embeds at most this many issues; further references are
          # listed by number only, so a reference never disappears silently.
          # Tests override it.
          : "${CODEX_MAX_LINKED_ISSUES:=8}"

          # The issue numbers stdin references with a closing/ref keyword, in
          # first-seen order and deduplicated, one per line; nothing when there
          # is no match. Two shapes count: `Closes #12` in a body and
          # `Refs: #12` in a commit trailer (the colon is optional).
          codex_issue_refs_stdin() {
            grep -oiE '(Closes|Fixes|Resolves|Refs|Part of):? *#[0-9]+' \
              | grep -oE '[0-9]+' \
              | awk '!seen[$0]++' || true
          }

          # The references stdin carries beyond the embed cap, one per line;
          # the prompt names them without their bodies. Reads plain numbers.
          codex_issue_refs_overflow_stdin() {
            tail -n +"$((CODEX_MAX_LINKED_ISSUES + 1))" || true
          }
          LINKED_ISSUES_SH
          echo "linked-issue collector written to $RUNNER_TEMP/codex-linked-issues.sh"

      # The prompt = the committed rubric + this PR's metadata + every linked
      # issue. References are collected from the PR body's closing/ref keywords
      # and the commits' `Refs:` trailers (#555: body-only, first-match
      # discovery silently dropped the spec when the body lost its keyword),
      # deduplicated, body references first, capped by the collector. No
      # reference at all, or a reference that cannot be fetched, fails this
      # step before Codex runs: the reviewer cannot fetch anything itself, and
      # a review that never saw a spec must not look complete. GH_TOKEN stays
      # on this step (and the posting steps) only.
      - name: Build the review prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/codex-linked-issues.sh"
          gh pr view "$PR" --json number,title,body,url,baseRefOid > pr.json
          base=$(jq -r .baseRefOid pr.json)
          # The prompt must describe the tree actually checked out, not a head
          # that moved between checkout and this call.
          head=$(git rev-parse HEAD)
          # The body's references come first (its first one is the spec by
          # convention), then the commits'; `Closes #12` and `Refs: #12` both
          # count.
          refs=$( { jq -r '.body // ""' pr.json; git log --format=%B "$base..$head"; } \
            | codex_issue_refs_stdin )
          if [ -z "$refs" ]; then
            echo "::error title=No linked issue::The PR body and commits reference no issue. Add a 'Closes #N' line to the body or a 'Refs: #N' trailer to a commit; the gate re-runs by itself."
            exit 1
          fi
          linked=$(printf '%s\n' "$refs" | head -n "$CODEX_MAX_LINKED_ISSUES")
          omitted=$(printf '%s\n' "$refs" | codex_issue_refs_overflow_stdin)
          # Fetch every linked issue before the model runs: a missing or
          # unfetchable reference fails the step, never a silently spec-less
          # review.
          for n in $linked; do
            if ! gh issue view "$n" --json number,title,body \
              --jq '"### #" + (.number | tostring) + " " + .title + "\n\n" + (.body // "(empty)")' \
              > "issue-$n.md" 2> "issue-$n.err"; then
              echo "::error title=Linked issue unfetchable::gh issue view #$n failed: $(tr '\n' ' ' < "issue-$n.err")"
              exit 1
            fi
          done
          {
            cat .github/codex/prompts/review.md
            echo
            echo "---"
            echo
            echo "# This pull request"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Number: #$PR"
            printf -- '- Title: %s\n' "$(jq -r .title pr.json)"
            printf -- '- URL: %s\n' "$(jq -r .url pr.json)"
            printf -- '- Base commit: %s\n' "$base"
            printf -- '- Head commit: %s\n' "$head"
            printf 'Review the changes with: `git diff %s...%s`.\n' "$base" "$head"
            echo
            echo "## PR body"
            echo
            jq -r '.body // "(empty)"' pr.json
            echo
            echo "## Linked issues"
            echo
            echo "Every issue the PR body and commits reference, deduplicated, body references first, capped at $CODEX_MAX_LINKED_ISSUES."
            for n in $linked; do
              echo
              cat "issue-$n.md"
            done
            if [ -n "$omitted" ]; then
              echo
              echo "Further referenced but not embedded (over the cap): $(printf '#%s ' $omitted)"
            fi
          } > codex-prompt.md

      # Bounded, and salvageable when it does not return (#530): a completed
      # review is still published if the step is cancelled at its bound; a cut
      # stream (no verdict) fails the post step instead of being published.
      - name: Run Codex (read-only)
        id: codex
        continue-on-error: true
        timeout-minutes: 12
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENCODE_API_KEY }}
          responses-api-endpoint: https://opencode.ai/inference/openai/v1/responses
          model: gpt-6-luna
          codex-version: 0.160.0
          permission-profile: ":read-only"
          prompt-file: codex-prompt.md
          output-file: codex-output.md

      # Post the review and hand its comment ID to the approve step. The ID
      # anchors the readback: only this run's comment can decide this run's
      # approval, so no other comment can shadow or forge the verdict.
      - name: Post the review as a comment
        id: review-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/codex-verdict.sh"
          if [ ! -s codex-output.md ]; then
            echo "Codex produced no output." >&2
            exit 1
          fi
          # Publish only a COMPLETE review (the shared parser): its last
          # non-blank line must end with the verdict marker. A step that hung
          # after writing the file (#150/#169) is salvaged here; a cut stream
          # that stayed cut fails loudly instead of posting half a review.
          # Trailing blank lines are trimmed so the verdict stays the comment's
          # final line; approval then requires the marker on its own line.
          if [ -z "$(codex_verdict_of_file codex-output.md)" ]; then
            echo "Codex output is incomplete (its last non-blank line does not end with the verdict); not posting." >&2
            exit 1
          fi
          codex_trim_trailing_blanks codex-output.md > codex-output.trimmed.md
          mv codex-output.trimmed.md codex-output.md
          # A review of a commit the PR has moved past is noise on the PR;
          # refuse it rather than posting a stale comment.
          reviewed=$(git rev-parse HEAD)
          current=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$reviewed" ]; then
            echo "PR head moved from $reviewed to $current; not posting a stale review." >&2
            exit 1
          fi
          cat codex-output.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo '## Codex review'
            echo
            printf '_Reviewed commit: `%s`._\n' "$reviewed"
            if [ "$CODEX_OUTCOME" != "success" ]; then
              echo
              echo '_The Codex step did not return; this review was salvaged from the complete output it had already written._'
            fi
            echo
            cat codex-output.md
          } > comment.md
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -F body=@comment.md --jq .id)
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"

      # The approve step reads back exactly the comment posted above. A
      # non-PASS verdict fails this step so `gh pr checks`'s red/green mirrors
      # the verdict (#555), but posts no review event: GitHub Actions bots may
      # not request changes, because they cannot dismiss their own review and
      # would lock the PR. Approval remains the merge gate.
      - name: Approve when the verdict is clean
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ steps.review-comment.outputs.comment_id }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/codex-verdict.sh"
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$REVIEWED_SHA" ]; then
            echo "PR head moved from $REVIEWED_SHA to $head; the run for it decides."
            exit 0
          fi
          # Only a marker that stands on its own line approves (markdown
          # emphasis tolerated): a review that merely quotes the marker in
          # prose is published but never approved — approval is fail-closed.
          body=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq '.body // ""')
          last=$(printf '%s\n' "$body" | codex_last_line_stdin)
          verdict=$(codex_strict_verdict_of_line "$last")
          if [ "$verdict" != "PASS" ]; then
            echo "::error title=Codex review::Verdict: ${verdict:-incomplete}; not approving. The findings are in this run's review comment."
            exit 1
          fi
          # Pin the approval to the reviewed commit, so a push racing this call
          # cannot land an approval on a commit no review has seen.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f event=APPROVE \
            -f commit_id="$REVIEWED_SHA" \
            -f body="Automated review found no blocking findings."
