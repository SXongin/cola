name: Fuzz

# Weekly fuzzing for the only hand-written parser of untrusted bytes in the
# repo: the Feishu WS frame codec (`src/feishu/pbbp2.rs`, driven through
# `fuzz/fuzz_targets/pbbp2.rs`). The corpus rides the Actions cache so every
# run continues where the last one stopped; a crash fails the run and its
# reproducer lands in the uploaded artifacts. Plain scheduled job by decision:
# ClusterFuzzLite/OSS-Fuzz are rejected, and Scorecard's `Fuzzing` check
# already detects this target (`libfuzzer_sys` -> `RustCargoFuzzer`) and scores
# 10, so the schedule exists for the bug-finding value only — see ADR-0034's
# 2026-09-22 amendment.

on:
  schedule:
    - cron: '53 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pbbp2:
    name: pbbp2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: pbbp2-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pbbp2-corpus-
      - name: Install cargo-fuzz
        # Version-pinned rather than floating: the weekly job is the only
        # place this tool runs, so the installed version should change only
        # when someone bumps it here deliberately.
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz pbbp2
        # `-timeout=25` keeps a hanging input inside the budget: libFuzzer
        # turns it into a timeout reproducer and a failed run instead of
        # letting the job-level timeout kill the runner before artifacts
        # are uploaded.
        run: cargo +nightly fuzz run pbbp2 -- -max_total_time=300 -timeout=25
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: pbbp2-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pbbp2-crash
          path: fuzz/artifacts/pbbp2
