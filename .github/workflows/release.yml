name: Release

on:
  push:
    # Strict semver without the v prefix: 1.2.3, 1.2.3-alpha.1, 1.2.3+build.5.
    # The trailing * keeps the trigger broad; an exact semver check runs as a
    # job step so malformed tags (e.g. 1.2.3.4) fail loudly.
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Validate semver tag (bash)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' <<< "$GITHUB_REF_NAME"; then
            echo "Tag '$GITHUB_REF_NAME' is not a valid semver version" >&2
            exit 1
          fi
      - name: Validate semver tag (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            Write-Error "Tag '$env:GITHUB_REF_NAME' is not a valid semver version"
            exit 1
          }
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (tar)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/cola-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" cola
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cola.exe" "dist/cola-${env:GITHUB_REF_NAME}-${{ matrix.target }}.exe"
          Compress-Archive -Path "dist/cola-${env:GITHUB_REF_NAME}-${{ matrix.target }}.exe" -DestinationPath "dist/cola-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cola-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS