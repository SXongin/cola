# OpenCode reviews every non-draft PR from this repository on the two axes from
# CONTRIBUTING.md "Reviewing" and approves it when the review finds nothing
# blocking. That approval is the automated non-author review the `main: review`
# ruleset needs (ADR-0034 item 6); it replaced CodeRabbit, whose automatic
# reviews skip public repositories under ten stars.
#
# Requires the repository setting Actions -> General -> "Allow GitHub Actions
# to create and approve pull requests". `require_last_push_approval` on the
# `main: review` ruleset means every synchronize must approve the newest
# commit; the last step skips the approval when the PR head moved mid-run.
name: OpenCode Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Fork PRs never see secrets, so the model would have no API key to run
    # with. Dependabot PRs are skipped too: `opencode github run` asserts the
    # triggering actor is a collaborator, and a bot actor 404s that check, so
    # the run would fail before reviewing. Drafts wait for ready_for_review.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # anomalyco/opencode/github installs the CLI from releases/latest at run
      # time, so pinning that action would not pin the code that actually runs.
      # Installing a fixed release here does. The archive has no checksum file,
      # so the SHA256 below (the asset's digest from the release metadata) is
      # the integrity pin; version, URL, and digest move together.
      - name: Install opencode 1.18.31
        env:
          SHA256: b283e8dbe9e6fc224bb4b79992ce3bd2174b8b7b0c3e7d1b4e6024a1d11edc84
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/anomalyco/opencode/releases/download/v1.18.31/opencode-linux-x64-baseline.tar.gz" \
            -o "$RUNNER_TEMP/opencode.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/opencode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/bin"
          chmod 755 "$RUNNER_TEMP/bin/opencode"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: opencode-go/deepseek-v4.1-flash
          USE_GITHUB_TOKEN: "true"
          # `opencode github run` never answers permission asks, so any request
          # that would prompt hangs the job until the timeout. Deny edits, and
          # deny bash except the read-only verbs a review needs (upstream's own
          # review workflow posture, plus an explicit `gh pr review` denial so
          # the approval stays with the step below — anything else, `gh api`
          # included, stays denied); allow the asks a review must not trip:
          # paths outside the checkout and .env reads (the runner holds no
          # .env secrets).
          OPENCODE_PERMISSION: |
            {
              "edit": "deny",
              "bash": {
                "*": "deny",
                "git diff*": "allow",
                "git show*": "allow",
                "git log*": "allow",
                "git status*": "allow",
                "git blame*": "allow",
                "git grep*": "allow",
                "git rev-parse*": "allow",
                "git ls-files*": "allow",
                "git ls-tree*": "allow",
                "git cat-file*": "allow",
                "gh pr view*": "allow",
                "gh pr diff*": "allow",
                "gh pr list*": "allow",
                "gh issue view*": "allow",
                "gh issue list*": "allow",
                "gh search*": "allow",
                "gh release view*": "allow",
                "gh repo view*": "allow",
                "gh pr review*": "deny"
              },
              "external_directory": "allow",
              "read": {"*.env": "allow", "*.env.*": "allow"}
            }
          PROMPT: |
            Review this pull request on the two axes from CONTRIBUTING.md's
            "Reviewing" section: Spec (does the diff implement what the
            originating issue or spec asked for?) and Standards
            (CODING_STANDARDS.md and repo conventions). The PR body should
            link its issue; read it. Cite explicitly any place where the diff
            contradicts an existing ADR in docs/adr/.

            Rules:
            - Read-only: editing tools are disabled and any unpushed change
              would fail the run. Do not try to write.
            - Shell access is limited to the read-only `git`/`gh` commands in
              this workflow's `OPENCODE_PERMISSION` allowlist (you can read it
              in the checkout). Everything else - `gh api`, `gh pr review`,
              any write - is denied. Do not post reviews, comments, or labels
              yourself; the workflow posts this response and approves when the
              verdict below is PASS.
            - A missing or failed part of the review is a blocking finding.

            Finish with exactly one final line, on its own line and with
            nothing after it — no punctuation, no code fence:
            OPENCODE_REVIEW_VERDICT: PASS
              when the review is complete and nothing blocks merging;
            OPENCODE_REVIEW_VERDICT: FAIL
              when anything blocks merging or you could not complete the
              review.
        run: opencode github run

      # The review's response is posted as a PR comment; read the verdict back
      # so a missing or failed review can never approve. A FAIL stays silent on
      # purpose: GitHub Actions bots may not request changes, because they
      # cannot dismiss their own review and would lock the PR.
      - name: Approve when the verdict is clean
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$REVIEWED_SHA" ]; then
            echo "PR head moved from $REVIEWED_SHA to $head; the run for it decides."
            exit 0
          fi
          # Only a verdict on its own final line counts; the handler appends a
          # session footer after the model's response, so scan for the last
          # line-final marker instead of a substring. Nothing found means no
          # approval.
          verdict=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" or .user.login == "github-actions")] | last | (.body // "")' \
            | sed -nE 's/.*OPENCODE_REVIEW_VERDICT: (PASS|FAIL)[[:space:]]*$/\1/p' | tail -n 1 || true)
          if [ "$verdict" != "PASS" ]; then
            echo "Verdict: ${verdict:-none}; not approving."
            exit 0
          fi
          # Pin the approval to the reviewed commit, so a push racing this call
          # cannot land an approval on a commit no review has seen.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f event=APPROVE \
            -f commit_id="$REVIEWED_SHA" \
            -f body="Automated review found no blocking findings."
