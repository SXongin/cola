# Codecov configuration — https://docs.codecov.com/docs/codecovyml-reference
#
# The `coverage` job in .github/workflows/ci.yml uploads the lcov report that
# these settings apply to.
#
# `patch` stays at `auto` on purpose: its reds have caught real untested
# branches, and the process/OS-boundary lines it can never see are handled by
# the `ignore` list below — never by weakening the target. See
# `CONTRIBUTING.md` ("Coverage").
coverage:
  status:
    project:
      default:
        # Stay within 1% of main's coverage; the PR comment shows the delta.
        target: auto
        threshold: 1%
    patch:
      default:
        # New/changed lines should be about as covered as the project.
        target: auto
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  # Only comment when the PR actually moves coverage.
  require_changes: true

# Build tooling, not shipped code.
ignore:
  - "xtask/**"
  # Test support files (`src/bridge/tests/**` is already excluded by
  # cargo-llvm-cov's `tests/` default). In-file `#[cfg(test)]` modules still
  # count; excluding those needs nightly `#[coverage(off)]`.
  - "src/test_*.rs"
  - "src/bridge/test_support.rs"
  # The opted-in live harness (ADR-0057): every test is `#[ignore]`-gated and
  # needs a pinned binary, so the instrumented hermetic `coverage` job can
  # never execute these lines — the advisory `Live V1`/`Live V2` jobs run them.
  - "src/opencode/live/**"
  # The machine-local attach check (`#[ignore]`-gated, needs a live local
  # server): same rationale as the live harness. A file of its own so those
  # lines do not read as `src/bridge/attach.rs`'s coverage.
  - "src/bridge/attach_live.rs"
