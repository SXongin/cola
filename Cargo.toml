[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "cola"
version = "0.1.0"
edition = "2024"
description = "A bridge bot that brings the OpenCode AI coding experience into Feishu"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
async-trait = "0.1"
indexmap = "2"

[dev-dependencies]
tempfile = "3"
