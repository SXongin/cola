[workspace]
members = [".", "xtask"]
# The cargo-fuzz crate is its own workspace; keep root commands (fmt, clippy,
# test) from reaching into it.
exclude = ["fuzz"]
resolver = "3"

[package]
name = "colark"
version = "0.8.4"
edition = "2024"
description = "A bridge bot that brings the OpenCode AI coding experience into Feishu"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SXongin/cola"
homepage = "https://github.com/SXongin/cola"
keywords = ["feishu", "lark", "opencode", "bot", "bridge"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cola"
path = "src/main.rs"

# cargo-binstall support (ADR-0037): binstall's default pkg-url guesses the
# asset name from the crate name (`colark-...`) while releases ship
# `cola-<version>-<target>`; the binary name is hardcoded because `{ bin }` is
# only renderable in bin-dir, not in pkg-url. quick-install serves third-party
# builds, so it is disabled; `compile` remains the fallback for targets without
# an asset (Linux aarch64, Intel macOS).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/cola-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
thiserror = "2"
anyhow = "1"
dirs = "7"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
async-trait = "0.1"
indexmap = "2"
sysinfo = "0.39"
semver = "1"
sha2 = "0.11"
tempfile = "3"

[target.'cfg(not(target_os = "windows"))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
