# CodeRabbit reviews every pull request (free for public repositories).
# request_changes_workflow makes it approve once its unresolved comments are
# resolved and the latest commit is reviewed, so the PR carries a real
# non-author approval (ADR-0034). Pre-merge docstring coverage would nag on a
# codebase that documents selectively, so it is off; the other checks stay as
# warnings and never block.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: true
  auto_review:
    enabled: true
    drafts: false
  pre_merge_checks:
    docstrings:
      mode: off
